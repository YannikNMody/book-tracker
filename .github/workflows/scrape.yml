name: Daily scrape

# Scrapes books.toscrape.com and loads the run into Supabase.
# Runs on GitHub's servers, so it does not depend on your own network.
# Needs one repository secret: DATABASE_URL (Session pooler URI, see .env.example).

on:
  # Daily schedule: SWITCHED OFF on purpose. books.toscrape.com never changes,
  # so daily runs would only add identical snapshots. To switch it on,
  # delete "# " (hash + space) at the start of the two lines below and push.
  # schedule:
  #   - cron: "17 4 * * *"        # every day at 04:17 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:               # "Run workflow" button on the Actions tab
    inputs:
      args:
        description: "Extra scraper arguments, e.g. --limit 20 (empty = full catalogue)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-scrape              # never two runs at once; a second one waits
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and load
        env:
          EXTRA_ARGS: ${{ inputs.args }}
        # Exit codes: 0 success, 3 partial scrape (still loaded), 4 scraped but load failed, 1 failed.
        # Any non-zero code marks the run red, and GitHub emails you.
        run: python books_scraper.py --load $EXTRA_ARGS 2>&1 | tee scrape.log

      - name: Delete raw staging rows older than 30 days
        if: ${{ !cancelled() }}
        run: python loader.py --prune-staging-days 30

      - name: Write summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Scrape result"
            echo '```'
            grep -E "Status:|\| books seen|Loading failed|ERROR" scrape.log || echo "no summary lines found, see the step logs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw JSON as a download (30 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-run-${{ github.run_id }}
          path: scraper/output/*.json
          retention-days: 30
          if-no-files-found: ignore
